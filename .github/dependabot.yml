version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "08:00"
      timezone: "America/Sao_Paulo"
    allow:
      - dependency-name: "@maxebina/max-ds"
    cooldown:
      exclude:
        - "@maxebina/max-ds"
    open-pull-requests-limit: 3
